<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f9bed8">
<meta name="description" content="Katzigami: Ein süßes Katzen-Jump-'n'-Run mit magischen Pilzen, witzigen Dialogen und Entscheidungen, die die Geschichte verändern.">
<title>Katzigami VII ✿ Sieben Abenteuerwelten</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header class="topbar">
 <div class="brand"><span class="cat-icon">🐱</span> KATZIGAMI <span class="star">✿</span><span class="edition-mark" title="Sieben eigenständige Spielwelten">VII</span></div>
 <div class="top-actions"><span id="chapter-label">DAS PILZORAKEL</span><button id="sound-toggle" type="button" class="icon-button" aria-label="Ton umschalten">♫</button><button id="pause-toggle" type="button" class="icon-button" aria-label="Pause">Ⅱ</button></div>
</header>
<main id="stage" aria-label="Spielfeld">
 <canvas id="game" role="img" aria-label="Katzigami-Spielwelt"></canvas>
 <div id="hud" class="hud"><span class="hud-pill" id="hearts">♥ ♥ ♥</span><span class="hud-pill" id="mushrooms">🍄 0/7</span><span class="hud-pill level-pill" id="level">1 / 4</span></div>
 <div class="toast" id="toast" role="status" aria-live="polite"></div>
 <div id="overlay" class="overlay visible" aria-live="polite"><div id="overlay-content"></div></div>
 <div class="rotate-hint">✦ Im Querformat siehst du noch mehr! ✦</div>
</main>
<footer id="controls" class="controls" aria-label="Touch-Spielsteuerung">
 <div class="control-group"><button id="left" class="touch-button move" aria-label="Nach links" type="button">◀</button><button id="right" class="touch-button move" aria-label="Nach rechts" type="button">▶</button></div>
 <div class="control-decor">✿ <span>BLUMENMAGIE</span> ✿</div>
 <div class="control-group jump-group"><button id="special" class="touch-button special" aria-label="Spezialfähigkeit gesperrt" type="button" disabled><span id="special-icon">🔒</span><small id="special-label">GESPERRT</small></button><button id="jump" class="touch-button jump" aria-label="Springen" type="button"><span>↑</span><small>HÜPF!</small></button></div>
</footer>
</div>
<script src="game.js" defer></script>
</body>
</html>
